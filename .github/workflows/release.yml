name: Release APK

# Yangi versiya chiqarish: pubspec.yaml dagi versiyani oshirib (0.1.1+2 → 0.1.2+3) main'ga push qiling.
# Workflow APKni build qiladi va GitHub Release chiqaradi — ilovalar yangilanish oynasini ko'rsatadi.
# Versiya o'zgarmagan push'larda faqat "check" ishlaydi va build o'tkazib yuboriladi. Tag'ni qo'lda qo'ymang.
# Majburiy yangilash yoki qayta urinish: GitHub → Actions → Release APK → Run workflow.
# Batafsil: docs/OTA_UPDATE.md
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "Nima o'zgardi (bo'sh qolsa — oxirgi relizdan keyingi commit'lar ro'yxati)"
        required: false
        default: ''
      min_version_code:
        description: "Majburiy yangilash: versionCode shundan kichik bo'lganlar yangilanmasdan foydalana olmaydi (0 — majburiy emas)"
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Versiyani aniqlash
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          line=$(grep -E '^version:' pubspec.yaml)
          name=$(echo "$line" | sed -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+).*/\1/')
          code=$(echo "$line" | sed -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+).*/\2/')
          tag="v$name"
          echo "pubspec.yaml: $name+$code"

          if [ "$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::$tag relizi allaqachon bor — pubspec.yaml dagi versiyani oshiring"
              exit 1
            fi
            echo "$tag relizi allaqachon bor — versiya o'zgarmagan, reliz kerak emas."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reliz tag'ni o'zi yaratadi. Qo'lda qo'yilgan tag boshqa commit'da tursa, reliz noto'g'ri kodga bog'lanib qoladi.
          tag_sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$tag tag'i boshqa commit'da turibdi, lekin relizi yo'q. Uni o'chiring: git push origin :refs/tags/$tag && git tag -d $tag"
            exit 1
          fi

          # Ilova faqat versionCode kattaroq bo'lsa yangilanadi, Android ham kichigini o'rnatmaydi.
          prev_tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          prev_code=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/version.json" 2>/dev/null | jq -r '.versionCode // 0' 2>/dev/null || true)
          prev_code=${prev_code:-0}
          if [ "$code" -le "$prev_code" ]; then
            echo "::warning::pubspec.yaml dagi versionCode ($code) oldingi relizdagidan ($prev_code) katta emas — $((prev_code + 1)) ishlatildi. pubspec.yaml da '+' dan keyingi raqamni ham oshirib qo'ying."
            code=$((prev_code + 1))
          fi

          echo "Reliz: $tag (versionCode $code), oldingisi: ${prev_tag:--} ($prev_code)"
          {
            echo "release=true"
            echo "name=$name"
            echo "code=$code"
            echo "tag=$tag"
            echo "prev_tag=$prev_tag"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION_CODE: ${{ needs.check.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nima o'zgardi
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          PREV_TAG: ${{ needs.check.outputs.prev_tag }}
        run: |
          # Ilovadagi yangilanish oynasida ko'rinadi.
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > notes.txt
          elif [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
            git log --no-merges --format='- %s' "$PREV_TAG..HEAD" | head -n 20 > notes.txt
          else
            echo "- Birinchi versiya" > notes.txt
          fi
          cat notes.txt

      - name: Imzolash kalitini tiklash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Kalitsiz build debug kalit bilan imzolanadi va eski versiyalar ustiga o'rnatilmaydi — shuning uchun to'xtatamiz.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_* secret'lar to'liq emas (docs/OTA_UPDATE.md, 'GitHub secret'lar' bo'limi)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release-keystore.jks"
          } > android/key.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: APK va version.json
        env:
          MIN_VERSION_CODE: ${{ inputs.min_version_code || '0' }}
        run: |
          dart run tool/make_update.dart \
            --build-number "$VERSION_CODE" \
            --notes-file notes.txt \
            --min-version-code "$MIN_VERSION_CODE" \
            --apk-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"
          cat build/ota/version.json

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Oldingi muvaffaqiyatsiz urinishdan qolgan qoralama bo'lsa — o'chiramiz (chop etilgani bu yerga yetib kelmaydi).
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          # Avval qoralama: fayllar to'liq yuklanmaguncha ilovalar yarim tayyor relizni "latest" deb ko'rmasin.
          gh release create "$TAG" build/ota/* --draft --title "$TAG" --notes-file notes.txt --target "$GITHUB_SHA"
          gh release edit "$TAG" --draft=false --latest

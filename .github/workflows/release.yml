name: Release APK

# Yangi versiya chiqarishning ikki yo'li (avval pubspec.yaml dagi versiyani oshiring):
#   1) git tag -a v0.1.1 -m "Nima o'zgardi" && git push origin v0.1.1
#   2) GitHub → Actions → Release APK → Run workflow
# Batafsil: docs/OTA_UPDATE.md
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: "Nima o'zgardi (ilovadagi yangilanish oynasida ko'rinadi)"
        required: false
        default: ''
      min_version_code:
        description: "Majburiy yangilash: versionCode shundan kichik bo'lganlar yangilanmasdan foydalana olmaydi (0 — majburiy emas)"
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Versiyani aniqlash
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          line=$(grep -E '^version:' pubspec.yaml)
          name=$(echo "$line" | sed -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+).*/\1/')
          code=$(echo "$line" | sed -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+).*/\2/')
          tag="v$name"

          if [ "$EVENT" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag ($GITHUB_REF_NAME) pubspec.yaml dagi versiyaga ($tag) mos emas"
              exit 1
            fi
            # actions/checkout annotated tag'ni oddiy tag'ga aylantirib qo'yishi mumkin — xabarini qayta olamiz.
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            git tag -l --format='%(contents)' "$tag" > notes.txt
          else
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag allaqachon mavjud — pubspec.yaml dagi versiyani oshiring"
              exit 1
            fi
            printf '%s' "$INPUT_NOTES" > notes.txt
          fi

          # Ilova faqat versionCode kattaroq bo'lsa yangilanadi, Android ham kichigini o'rnatmaydi.
          prev=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/version.json" 2>/dev/null | jq -r '.versionCode // 0' 2>/dev/null) || prev=0
          prev=${prev:-0}
          if [ "$code" -le "$prev" ]; then
            echo "::error::versionCode ($code) oldingi relizdagidan ($prev) katta bo'lishi kerak — pubspec.yaml da '+' dan keyingi raqamni oshiring"
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Imzolash kalitini tiklash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Kalitsiz build debug kalit bilan imzolanadi va eski versiyalar ustiga o'rnatilmaydi — shuning uchun to'xtatamiz.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_* secret'lar to'liq emas (docs/OTA_UPDATE.md, 'GitHub secret'lar' bo'limi)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release-keystore.jks"
          } > android/key.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: APK va version.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MIN_VERSION_CODE: ${{ inputs.min_version_code || '0' }}
        run: |
          dart run tool/make_update.dart \
            --notes-file notes.txt \
            --min-version-code "$MIN_VERSION_CODE" \
            --apk-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"
          cat build/ota/version.json

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Avval qoralama: fayllar to'liq yuklanmaguncha ilovalar yarim tayyor relizni "latest" deb ko'rmasin.
          gh release create "$TAG" build/ota/* --draft --title "$TAG" --notes-file notes.txt --target "$GITHUB_SHA"
          gh release edit "$TAG" --draft=false --latest
